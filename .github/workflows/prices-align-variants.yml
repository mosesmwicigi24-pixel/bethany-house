name: Variant prices vs their product

# prices:align-variants on the VPS (owner, 2026-11-26): a product's variants
# are sold at the product's price.
#
#   "Count": read-only — how many variant prices are not at their product's.
#   "Email me the list": read-only; the list goes to the owner's address
#   (AUDIT_OWNER_EMAIL), the log shows only counts.
#   "Align": sets those variants to their product's selling price and sale
#   window (never the cost). Needs `actor` (the super admin's hub user
#   NUMBER, never an email) and `confirm` typed exactly as ALIGN. Each change
#   is on the hub's audit trail with the old price.
#
# The repository is public: no product, variant or price is printed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: ["Count", "Email me the list", "Align"]
        default: "Count"
      actor:
        description: "Align: your hub user number (the super admin approving it)"
        required: false
        default: ""
      confirm:
        description: "Align: type ALIGN"
        required: false
        default: ""

concurrency:
  group: prices-align-variants
  cancel-in-progress: false

jobs:
  run:
    name: Variant prices (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "Align" ]; then
            [[ "$ACTOR" =~ ^[0-9]{1,9}$ ]] || { echo "::error::actor must be your hub user number; nothing was run."; exit 1; }
            [ "$CONFIRM" = "ALIGN" ] || { echo "::error::confirm must be ALIGN; nothing was run."; exit 1; }
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            for i in 1 2 3 4 5; do
              ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
              [ -s ~/.ssh/known_hosts ] && break
              sleep $((i * 5))
            done
            [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not read host key"; exit 1; }
          fi
        timeout-minutes: 3

      - name: Run it (counts only)
        env:
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
        run: |
          case "$MODE" in
            "Align")             CMD="php artisan prices:align-variants --apply --actor=$ACTOR" ;;
            "Email me the list") CMD="php artisan prices:align-variants --mail" ;;
            *)                   CMD="php artisan prices:align-variants" ;;
          esac
          KEEP='^(Products with a variant out of step: [0-9]+|Variant prices out of step: [0-9]+|Would go up: [0-9]+|Would go down: [0-9]+|Same price, sale details differ: [0-9]+|Variant has no price in that currency: [0-9]+|Aligned now: [0-9]+|Still out of step: [0-9]+|List emailed to the owner\.|Dry run: nothing changed\.|No owner email configured.*|--apply needs .*)$'
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -i ~/.ssh/deploy_key "root@${{ secrets.VPS_HOST }}" \
            "cd /opt/bethany-house && set -o pipefail && docker compose run --rm -T laravel $CMD 2>&1 | grep -E '$KEEP'"
        timeout-minutes: 15
