# Deploy to the Hostinger VPS (hub.bethanyhouse.co.ke) on every push to main.
#
# Flow (PULL-BASED since 2026-08-10): build the three production images ->
# push to GHCR under this repo -> DONE. The VPS deploys ITSELF: a systemd
# timer (deploy/box-deploy.timer) runs deploy/box-deploy.sh every ~60s, which
# polls main's sha via the public GitHub API and, when it changes, pulls the
# new images and redeploys (compose sync + pull + migrate + up, exactly what
# the old SSH step here used to do). No inbound SSH from GitHub is needed —
# runner->VPS SSH kept timing out (Hostinger-level filtering / fail2ban).
# Operator bootstrap + rollback: docs/DEPLOY.md.
#
# No secrets are required for deploys anymore (GITHUB_TOKEN pushes to GHCR).
# The legacy push-based secrets (VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS) are
# only needed if the commented-out rollback steps below are re-enabled.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Per-ref: main deploys serialize; each PR gets its own lane.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, gd, zip, intl, bcmath
          coverage: none

      - name: Seed test environment
        working-directory: backend
        run: cp .env.example .env

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run tests
        working-directory: backend
        run: php artisan test

  build:
    name: Build ${{ matrix.service }}
    needs: test
    # Only build/deploy on pushes to main (and manual dispatch); PRs run tests only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bethany-laravel
            context: ./backend
            build-args: ""
          - service: bethany-nextjs
            context: ./frontend
            build-args: |
              NEXT_PUBLIC_API_URL=/api
              NEXT_PUBLIC_APP_URL=https://hub.bethanyhouse.co.ke
          - service: bethany-react-admin
            context: ./react-admin
            build-args: |
              VITE_API_URL=https://hub.bethanyhouse.co.ke/api
              VITE_BASE_PATH=/admin/
              VITE_REVERB_APP_KEY=62102a9dad2a1f794d008d6e89ae2afd
              VITE_REVERB_HOST=hub.bethanyhouse.co.ke
              VITE_REVERB_PORT=443
              VITE_REVERB_SCHEME=https
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy notice (pull-based)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pull-based deploy notice
        run: |
          echo "Images for ${GITHUB_SHA} are on GHCR."
          echo "Pull-based deploy: the box polls main every ~60s and will pull + migrate + restart itself once all three images are visible."
          echo "Watch on the VPS: journalctl -u box-deploy.service -f   |   tail -f /opt/bethany-house/deploy.log"
          echo "NOTE: until the one-time box bootstrap in docs/DEPLOY.md has been run, nothing deploys — the old containers keep running."

  # ───────────────────────────────────────────────────────────────────────────
