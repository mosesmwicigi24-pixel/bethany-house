name: Android

# Native apps programme (Step 6/7): compiles the Android app, runs the core
# unit tests and keeps an unsigned debug APK as a build artifact. Release
# signing is deliberately absent here — signing keys never enter the repo or
# CI; see docs/NATIVE_APPS_ANDROID.md for the release procedure.

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:testDebugUnitTest --console=plain

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Lint (report only)
        run: ./gradlew :app:lintDebug --console=plain || true

      - uses: actions/upload-artifact@v4
        with:
          name: hub-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
