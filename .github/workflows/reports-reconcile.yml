name: Reports reconcile

# Runs `php artisan reports:reconcile` (currency plan Step 7, READ-ONLY) on
# the VPS, reaching the box as history-audit.yml does. The repository is
# public, so the log shows only the verdicts (TIES / DOES NOT TIE) with every
# money figure masked as "#", plus the id, currency and status of any till
# row that does not tie (its name stripped); the full report, figures
# included, is written on the box to /opt/bethany-house/reconcile/<timestamp>.txt.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Period start (Y-m-d)'
        required: true
        default: '2026-08-01'
      to:
        description: 'Period end (Y-m-d); empty = today'
        required: false
        default: ''

concurrency:
  group: reports-reconcile
  cancel-in-progress: false

jobs:
  run:
    name: reports:reconcile (verdicts only in the log)
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            for i in 1 2 3 4 5; do
              ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
              [ -s ~/.ssh/known_hosts ] && break
              sleep $((i * 5))
            done
            [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not read host key"; exit 1; }
          fi
        timeout-minutes: 3

      - name: Run reports:reconcile on the VPS
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          case "$FROM" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::from must be Y-m-d"; exit 1;; esac
          TOFLAG=""
          if [ -n "$TO" ]; then
            case "$TO" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) TOFLAG="--to=$TO" ;; *) echo "::error::to must be Y-m-d"; exit 1;; esac
          fi
          # The full report lands on the box; the log gets verdict lines with figures masked.
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -i ~/.ssh/deploy_key "root@${{ secrets.VPS_HOST }}" \
            "cd /opt/bethany-house && mkdir -p reconcile && OUT=reconcile/\$(date -u +%Y%m%dT%H%M%SZ).txt && docker compose run --rm -T laravel php artisan reports:reconcile --from=$FROM $TOFLAG > \$OUT 2>&1; RC=\$?; echo \"full report on the box: /opt/bethany-house/\$OUT (exit \$RC)\"; grep -E 'TIES|do not tie|Reconciliation|no reporting rate|record\(s\)|^\| #[0-9]+' \$OUT | sed -E 's/^\| #([0-9]+) [^|]*\|/| #\1 |/; s/[0-9][0-9,]*\.[0-9]{2}/#/g'; exit \$RC"
        timeout-minutes: 20
