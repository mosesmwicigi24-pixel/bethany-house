# react-admin/nginx.conf

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Strip /admin prefix and re-dispatch ───────────────────────────────────
    # Nginx location priority: = > ^~ > ~ > prefix
    # The regex location for assets would match /admin/assets/*.js BEFORE the
    # prefix location /admin/ - so we must use ^~ to block regex matching and
    # force the rewrite to happen first.
    #
    # After rewrite with `last`, Nginx re-evaluates the rewritten URI
    # (/assets/index.js) against all locations again - this time the regex
    # location matches correctly and serves the file from disk.

    location = /admin  { rewrite ^ /      last; }
    location = /admin/ { rewrite ^ /      last; }

    # ^~ prevents regex locations from matching /admin/* - rewrite runs first
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /$1 last;
    }

    # ── PWA control files - NEVER cache ───────────────────────────────────────
    # sw.js and registerSW.js are NOT content-hashed: they keep the same URL on
    # every deploy. The regex block below would otherwise hand them
    # `Cache-Control: public, immutable` with a 1-year expiry, so a browser that
    # already has them would keep serving the OLD service worker - and with it
    # the OLD precache manifest - long after a deploy. Browsers cap the service
    # worker script at 24h, but that is still up to a full day of the previous
    # bundle. Exact-match `location =` outranks the regex block, so these win.
    # /admin/sw.js is rewritten to /sw.js above and re-dispatched here.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── Hashed static assets - cache forever (matched after rewrite) ──────────
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html - never cache ──────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}