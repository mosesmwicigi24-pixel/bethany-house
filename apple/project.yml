# XcodeGen spec for the Apple apps (native apps programme).
#   brew install xcodegen
#   cd apple && xcodegen generate && open BethanyHub.xcodeproj
#
# Two app targets share the local Swift package (BethanyKit + BethanyUI):
#   HubMac     macOS 14+, Apple Silicon and Intel, App Sandbox, APNs
#   HubMobile  iOS/iPadOS 17+, universal (iPhone + iPad layouts), APNs,
#              background location while clocked in
#   TailorsMobile  "Tailors Hub", the workshop app: the same code with
#              AppFlavor.tailors (production, own time and pay, messages)
# Entitlements are set with CODE_SIGN_ENTITLEMENTS, never XcodeGen's
# `entitlements: path:`: given a path without `properties`, XcodeGen rewrites
# the file as an empty <dict/>, so every generated build lost push, associated
# domains, the keychain group and (Mac) the sandbox. The committed .entitlements
# files are the only source; generating must leave them untouched.
# Signing: set DEVELOPMENT_TEAM in Signing.xcconfig (not committed) or in
# Xcode; the bundle id ke.co.bethanyhouse.hub matches the Expo shell so the
# store listing continues (docs/NATIVE_APPS_APPLE.md).
# A free Apple ID (Personal Team) cannot sign push or associated domains:
# use scripts/personal-device.sh, which generates project.personal.yml.
name: BethanyHub
options:
  bundleIdPrefix: ke.co.bethanyhouse
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
packages:
  BethanyHub:
    path: .
targets:
  HubMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/HubMac
    dependencies:
      - package: BethanyHub
        product: BethanyKit
      - package: BethanyHub
        product: BethanyUI
    info:
      path: Apps/HubMac/Info.plist
      properties:
        CFBundleDisplayName: Bethany House Hub
        CFBundleName: Bethany House Hub
        LSApplicationCategoryType: public.app-category.business
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: © Bethany House
        NSLocationUsageDescription: Bethany House Hub checks that you are at the shop when you clock in or out.
        NSCameraUsageDescription: Attach receipts and QC photos.
        BHReverbKey: ""
        CFBundleURLTypes:
          - CFBundleURLName: ke.co.bethanyhouse.hub
            CFBundleURLSchemes: [bethanyhub]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Apps/HubMac/HubMac.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.hub
        PRODUCT_NAME: Bethany House Hub
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: $(ARCHS_STANDARD)
  HubMobile:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Apps/HubMobile
    dependencies:
      - package: BethanyHub
        product: BethanyKit
      - package: BethanyHub
        product: BethanyUI
    info:
      path: Apps/HubMobile/Info.plist
      properties:
        CFBundleDisplayName: Bethany Hub
        CFBundleName: Bethany House Hub
        UILaunchScreen: {}
        UIBackgroundModes: [location, remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocationWhenInUseUsageDescription: Bethany House Hub checks that you are at the shop when you clock in or out, and records your position while you are on shift.
        NSLocationAlwaysAndWhenInUseUsageDescription: While you are clocked in, Bethany House Hub records your position every few minutes so your manager can see you are on site. It stops when you clock out and never runs off shift.
        NSFaceIDUsageDescription: Unlock the Hub with Face ID instead of typing your password.
        NSCameraUsageDescription: Attach receipts, QC photos, scan serial numbers, and take the clock-in kiosk punch photo.
        NSPhotoLibraryUsageDescription: Attach photos to expenses, products and messages.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ke.co.bethanyhouse.hub
            CFBundleURLSchemes: [bethanyhub]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Apps/HubMobile/HubMobile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.hub
        PRODUCT_NAME: Bethany House Hub
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  # Tailors Hub (owner, 2026-11-23): the workshop app for tailors, QC and
  # production managers. Same code as HubMobile (one app file, built with
  # TAILORS); what it shows is BethanyKit's AppFlavor.tailors. No push yet
  # (the server addresses one app identity) and no associated domains, so a
  # free Apple ID can sign it as it is.
  TailorsMobile:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Apps/HubMobile/HubMobileApp.swift
      - path: Apps/TailorsMobile
    dependencies:
      - package: BethanyHub
        product: BethanyKit
      - package: BethanyHub
        product: BethanyUI
    info:
      path: Apps/TailorsMobile/Info.plist
      properties:
        CFBundleDisplayName: Tailors Hub
        CFBundleName: Tailors Hub
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocationWhenInUseUsageDescription: Tailors Hub checks that you are at the workshop when you clock in or out, and records your position while you are on shift.
        NSLocationAlwaysAndWhenInUseUsageDescription: While you are clocked in, Tailors Hub records your position every few minutes so your manager can see you are on site. It stops when you clock out and never runs off shift.
        NSFaceIDUsageDescription: Unlock Tailors Hub with Face ID instead of typing your password.
        NSCameraUsageDescription: Take QC photos and attach photos to your messages.
        NSPhotoLibraryUsageDescription: Attach photos to QC records and messages.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ke.co.bethanyhouse.tailors
            CFBundleURLSchemes: [tailorshub]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Apps/TailorsMobile/TailorsMobile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ke.co.bethanyhouse.tailors
        PRODUCT_NAME: Tailors Hub
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TAILORS

# Shared schemes, so the run menu lists the iPhone/iPad app by name instead of
# depending on Xcode to autocreate one per target.
schemes:
  TailorsMobile:
    build:
      targets:
        TailorsMobile: all
    run:
      config: Debug
    archive:
      config: Release
  HubMobile:
    build:
      targets:
        HubMobile: all
    run:
      config: Debug
    archive:
      config: Release
  HubMac:
    build:
      targets:
        HubMac: all
    run:
      config: Debug
    archive:
      config: Release
